[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sitemap.xml"
    [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
    [headers.values]
    Content-Type = "text/plain" 